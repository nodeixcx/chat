<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人聊天室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{
  max-width:100%;
  margin:0 auto;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#f5f5f5;
  color:#333;
}
/* 消息容器 */
#msgBox{
  flex:1;
  overflow-y:auto;
  padding:16px 12px;
  background:#ededed;
}
/* 单条消息容器 */
.msg-item{
  display:flex;
  margin:14px 0;
  gap:10px;
}
/* 自己消息靠右，头像放右边 */
.msg-me{
  flex-direction:row-reverse;
}
.avatar{
  width:40px;height:40px;
  border-radius:6px;
  background:#bbbbbb;
  flex-shrink:0;
}
.bubble-wrap{
  max-width:65%;
}
.bubble{
  padding:10px 12px;
  border-radius:6px;
  font-size:15px;
  word-break:break-all;
  position:relative;
}
/* 对方：白色气泡 */
.msg-other .bubble{
  background:#ffffff;
}
/* 自己：微信绿色气泡 */
.msg-me .bubble{
  background:#95ec69;
}
.msg-time{
  font-size:11px;
  color:#888;
  margin-top:4px;
}
.msg-other .msg-time{
  text-align:left;
}
.msg-me .msg-time{
  text-align:right;
}
/* 底部输入栏 */
.inputArea{
  display:flex;
  gap:8px;
  padding:10px 12px;
  background:#f7f7f7;
  border-top:1px solid #ddd;
  align-items:center;
}
#nameInput{
  width:100px;
  padding:9px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
}
#textInput{
  flex:1;
  padding:9px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
}
button{
  padding:9px 16px;
  background:#07c160;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="msgBox"></div>
<div class="inputArea">
  <input id="nameInput" placeholder="你的昵称">
  <input id="textInput" placeholder="输入消息，回车发送">
  <button onclick="sendMsg()">发送</button>
</div>

<script>
// =========填入你的Supabase信息=========
const SUPABASE_URL = "https://akbssxkviozqegqvaopk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYnNzeGt2aW96cWVncXZhb3BrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDYxMDMsImV4cCI6MjEwNjQyMjEwM30.vu35mU5lo_0JN8Oqe_VQLBc465MW7cJ_UC824lRQG2M";
// =====================================

const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msgBox = document.getElementById('msgBox');
const nameInput = document.getElementById('nameInput');
const textInput = document.getElementById('textInput');
let allMessages = [];

// 渲染微信样式消息
function render(){
  msgBox.innerHTML = '';
  const myName = nameInput.value.trim();
  allMessages.forEach(item=>{
    const isMe = item.username === myName;
    const wrap = document.createElement('div');
    wrap.className = `msg-item ${isMe ? 'msg-me':'msg-other'}`;
    wrap.innerHTML = `
      <div class="avatar"></div>
      <div class="bubble-wrap">
        <div class="bubble">${item.content}</div>
        <div class="msg-time">${item.username} ${new Date(item.created_at).toLocaleString()}</div>
      </div>
    `;
    msgBox.appendChild(wrap);
  })
  msgBox.scrollTop = msgBox.scrollHeight;
}

async function loadHistory(){
  const {data} = await supabase
    .from('chat_messages')
    .select('*')
    .order('created_at', {asc:true});
  allMessages = data;
  render();
}

async function sendMsg(){
  const name = nameInput.value.trim();
  const content = textInput.value.trim();
  if(!name || !content) return;
  await supabase.from('chat_messages').insert([{username:name, content}]);
  textInput.value = "";
}

textInput.addEventListener('keydown',e=>{
  if(e.key === 'Enter') sendMsg();
})

// Supabase实时订阅
const channel = supabase
  .channel('chat_realtime')
  .on('postgres_changes', {
    event:'INSERT',
    schema:'public',
    table:'chat_messages'
  }, (payload)=>{
    allMessages.push(payload.new);
    render();
  })
  .subscribe();

loadHistory();
</script>
</body>
</html>
