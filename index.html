<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人聊天室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{max-width:700px;margin:0 auto;padding:16px;background:#121212;color:#eee;height:100vh;display:flex;flex-direction:column;}
#msgBox{flex:1;overflow-y:auto;padding:10px;border:1px solid #333;border-radius:8px;margin-bottom:12px;}
.msg{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:70%;word-break:break-all;}
.me{background:#4080ff;margin-left:auto;}
.other{background:#2e2e2e;margin-right:auto;}
.time{font-size:11px;opacity:0.6;margin-top:4px;}
.inputArea{display:flex;gap:8px;}
#nameInput{width:120px;padding:10px;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:6px;}
#textInput{flex:1;padding:10px;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:6px;}
button{padding:10px 16px;background:#4080ff;color:white;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div id="msgBox"></div>
<div class="inputArea">
  <input id="nameInput" placeholder="你的昵称">
  <input id="textInput" placeholder="输入消息，回车发送">
  <button onclick="sendMsg()">发送</button>
</div>

<script>
// =========替换这里！你的supabase信息=========
const SUPABASE_URL = "https://akbssxkviozqegqvaopk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYnNzeGt2aW96cWVncXZhb3BrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDYxMDMsImV4cCI6MjEwNjQyMjEwM30.vu35mU5lo_0JN8Oqe_VQLBc465MW7cJ_UC824lRQG2M";
// ==========================================
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msgBox = document.getElementById('msgBox');
const nameInput = document.getElementById('nameInput');
const textInput = document.getElementById('textInput');

// 加载历史消息
async function loadMessages() {
  const {data} = await supabase
    .from('chat_messages')
    .select('*')
    .order('created_at', {asc:true});
  render(data);
}

function render(list){
  msgBox.innerHTML = '';
  list.forEach(item=>{
    const div = document.createElement('div');
    div.className = item.username === nameInput.value.trim() ? "msg me" : "msg other";
    const time = new Date(item.created_at).toLocaleString();
    div.innerHTML = `<div>${item.content}</div><div class="time">${item.username} · ${time}</div>`;
    msgBox.appendChild(div);
  })
  msgBox.scrollTop = msgBox.scrollHeight;
}

async function sendMsg(){
  const name = nameInput.value.trim();
  const content = textInput.value.trim();
  if(!name || !content) return;
  await supabase.from('chat_messages').insert([{username:name, content}]);
  textInput.value = "";
  loadMessages();
}
// 回车发送
textInput.addEventListener('keydown',e=>{
  if(e.key === 'Enter') sendMsg();
})

// 定时刷新消息（每2秒拉一次新消息）
loadMessages();
setInterval(loadMessages, 2000);
</script>
</body>
</html>
